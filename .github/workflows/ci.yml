name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Prevent redundant concurrent builds for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linting check
        run: npm run lint

      - name: TypeScript type checking
        run: npm run type-check

      - name: Production Next.js build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dummy-cloud
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: kc_players
          NEXT_PUBLIC_SEASON: 26/27
          NEXT_PUBLIC_CURRENT_GAMEWEEK: 4
        run: npm run build
